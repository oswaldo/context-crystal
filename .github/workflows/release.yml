name: Release

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag (e.g. v1.0.0)"
        required: true
        type: string

permissions:
  contents: write

jobs:
  build-release-matrix:
    name: Build (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: linux-x86_64
            install_deps: |
              sudo apt-get update
              sudo apt-get install -y clang libssl-dev libidn2-dev
          - os: ubuntu-24.04-arm
            target: linux-aarch64
            install_deps: |
              sudo apt-get update
              sudo apt-get install -y clang libssl-dev libidn2-dev
          - os: macos-14 # Apple Silicon (M-series)
            target: macos-aarch64
            install_deps: |
              brew install openssl libidn2 llvm
          - os: macos-15 # Intel Mac
            target: macos-x86_64
            install_deps: |
              brew install openssl libidn2 llvm
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Determine Release Version
        id: version
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            VERSION="${{ inputs.tag }}"
          else
            VERSION="${GITHUB_REF#refs/tags/}"
          fi
          echo "VERSION=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "21"

      - name: Setup sbt
        uses: sbt/setup-sbt@v1

      - name: Cache Coursier
        uses: coursier/cache-action@v6

      - name: Install System Dependencies
        run: ${{ matrix.install_deps }}

      - name: Configure macOS Environment
        if: runner.os == 'macOS'
        run: |
          OPENSSL_ROOT=$(brew --prefix openssl)
          LIBIDN2_ROOT=$(brew --prefix libidn2)
          echo "OPENSSL_ROOT=$OPENSSL_ROOT" >> "$GITHUB_ENV"
          echo "LIBIDN2_ROOT=$LIBIDN2_ROOT" >> "$GITHUB_ENV"
          echo "LDFLAGS=-L$OPENSSL_ROOT/lib -L$LIBIDN2_ROOT/lib" >> "$GITHUB_ENV"
          echo "CPPFLAGS=-I$OPENSSL_ROOT/include -I$LIBIDN2_ROOT/include" >> "$GITHUB_ENV"
          echo "PKG_CONFIG_PATH=$OPENSSL_ROOT/lib/pkgconfig:$LIBIDN2_ROOT/lib/pkgconfig" >> "$GITHUB_ENV"

      - name: Compile Optimized Native Release Binary (Thin LTO)
        run: |
          sbt 'set cli.native / nativeConfig ~= { _.withMode(scala.scalanative.build.Mode.releaseFast).withLTO(scala.scalanative.build.LTO.thin) }; cliNative/nativeLink'

      - name: Strip Binary
        run: |
          strip ./cli/native/target/scala-3.9.0/ccrystal-cli

      - name: Package Archive and Compute Checksum
        run: |
          VERSION="${{ steps.version.outputs.VERSION }}"
          TARGET="${{ matrix.target }}"
          ARCHIVE_NAME="ccrystal-${VERSION}-${TARGET}.tar.gz"
          STAGE_DIR="stage-${TARGET}"

          mkdir -p "$STAGE_DIR"
          cp ./cli/native/target/scala-3.9.0/ccrystal-cli "$STAGE_DIR/ccrystal"
          cp LICENSE README.md "$STAGE_DIR/"
          chmod +x "$STAGE_DIR/ccrystal"

          tar -czf "$ARCHIVE_NAME" -C "$STAGE_DIR" ccrystal LICENSE README.md

          if command -v sha256sum >/dev/null 2>&1; then
            sha256sum "$ARCHIVE_NAME" > "${ARCHIVE_NAME}.sha256"
          elif command -v shasum >/dev/null 2>&1; then
            shasum -a 256 "$ARCHIVE_NAME" > "${ARCHIVE_NAME}.sha256"
          fi

          mkdir -p dist
          mv "$ARCHIVE_NAME" dist/
          mv "${ARCHIVE_NAME}.sha256" dist/

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: release-${{ matrix.target }}
          path: dist/*
          retention-days: 2

  publish-release:
    name: Publish GitHub Release
    needs: build-release-matrix
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Determine Release Version
        id: version
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            VERSION="${{ inputs.tag }}"
          else
            VERSION="${GITHUB_REF#refs/tags/}"
          fi
          echo "VERSION=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Download all release artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Consolidate SHA256SUMS Manifest
        run: |
          cd artifacts
          cat *.sha256 > SHA256SUMS
          rm -f *.sha256
          echo "=== Consolidated SHA256SUMS ==="
          cat SHA256SUMS

      - name: Create or Update GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.VERSION }}
          name: "Context Crystal ${{ steps.version.outputs.VERSION }}"
          draft: false
          prerelease: false
          generate_release_notes: true
          files: |
            artifacts/*.tar.gz
            artifacts/SHA256SUMS
