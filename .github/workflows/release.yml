name: Release

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag (e.g. v1.0.0)"
        required: true
        type: string

permissions:
  contents: write

jobs:
  build-release-matrix:
    name: Build (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: linux-x86_64
            lto: scala.scalanative.build.LTO.thin
            install_deps: |
              sudo apt-get update
              sudo apt-get install -y clang libssl-dev libidn2-dev
          - os: ubuntu-24.04-arm
            target: linux-aarch64
            lto: scala.scalanative.build.LTO.thin
            install_deps: |
              sudo apt-get update
              sudo apt-get install -y clang libssl-dev libidn2-dev
          - os: macos-14 # Apple Silicon (M-series)
            target: macos-aarch64
            lto: scala.scalanative.build.LTO.none
            install_deps: |
              brew install openssl libidn2 llvm
          - os: macos-15 # Intel Mac
            target: macos-x86_64
            lto: scala.scalanative.build.LTO.none
            install_deps: |
              brew install openssl libidn2 llvm
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Determine Release Version
        id: version
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            VERSION="${{ inputs.tag }}"
          else
            VERSION="${GITHUB_REF#refs/tags/}"
          fi
          echo "VERSION=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "21"

      - name: Setup sbt
        uses: sbt/setup-sbt@v1

      - name: Cache Coursier
        uses: coursier/cache-action@v6

      - name: Install System Dependencies
        run: ${{ matrix.install_deps }}

      - name: Configure macOS Environment
        if: runner.os == 'macOS'
        run: |
          OPENSSL_ROOT=$(brew --prefix openssl)
          LIBIDN2_ROOT=$(brew --prefix libidn2)
          echo "OPENSSL_ROOT=$OPENSSL_ROOT" >> "$GITHUB_ENV"
          echo "LIBIDN2_ROOT=$LIBIDN2_ROOT" >> "$GITHUB_ENV"
          echo "LDFLAGS=-L$OPENSSL_ROOT/lib -L$LIBIDN2_ROOT/lib" >> "$GITHUB_ENV"
          echo "CPPFLAGS=-I$OPENSSL_ROOT/include -I$LIBIDN2_ROOT/include" >> "$GITHUB_ENV"
          echo "PKG_CONFIG_PATH=$OPENSSL_ROOT/lib/pkgconfig:$LIBIDN2_ROOT/lib/pkgconfig" >> "$GITHUB_ENV"

      - name: Compile Optimized Native Release Binary
        run: |
          sbt 'set cli.native / nativeConfig ~= { _.withMode(scala.scalanative.build.Mode.releaseFast).withLTO(${{ matrix.lto }}) }; cliNative/nativeLink'


      - name: Strip Binary
        run: |
          strip ./cli/native/target/scala-3.9.0/ccrystal-cli

      - name: Package Archive and Compute Checksum
        run: |
          VERSION="${{ steps.version.outputs.VERSION }}"
          TARGET="${{ matrix.target }}"
          ARCHIVE_NAME="ccrystal-${VERSION}-${TARGET}.tar.gz"
          STAGE_DIR="stage-${TARGET}"

          mkdir -p "$STAGE_DIR"
          cp ./cli/native/target/scala-3.9.0/ccrystal-cli "$STAGE_DIR/ccrystal"
          cp LICENSE README.md "$STAGE_DIR/"
          chmod +x "$STAGE_DIR/ccrystal"

          tar -czf "$ARCHIVE_NAME" -C "$STAGE_DIR" ccrystal LICENSE README.md

          if command -v sha256sum >/dev/null 2>&1; then
            sha256sum "$ARCHIVE_NAME" > "${ARCHIVE_NAME}.sha256"
          elif command -v shasum >/dev/null 2>&1; then
            shasum -a 256 "$ARCHIVE_NAME" > "${ARCHIVE_NAME}.sha256"
          fi

          mkdir -p dist
          mv "$ARCHIVE_NAME" dist/
          mv "${ARCHIVE_NAME}.sha256" dist/

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: release-${{ matrix.target }}
          path: dist/*
          retention-days: 2

  publish-release:
    name: Publish GitHub Release
    needs: build-release-matrix
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Determine Release Version
        id: version
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            VERSION="${{ inputs.tag }}"
          else
            VERSION="${GITHUB_REF#refs/tags/}"
          fi
          echo "VERSION=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Download all release artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Consolidate SHA256SUMS Manifest
        run: |
          cd artifacts
          cat *.sha256 > SHA256SUMS
          rm -f *.sha256
          echo "=== Consolidated SHA256SUMS ==="
          cat SHA256SUMS

      - name: Resolve Release Notes
        id: notes
        run: |
          VERSION="${{ steps.version.outputs.VERSION }}"
          NOTES_FILE="docs/releases/${VERSION}.md"
          if [ -f "$NOTES_FILE" ]; then
            echo "Using committed release notes from $NOTES_FILE"
            echo "body_path=$NOTES_FILE" >> "$GITHUB_OUTPUT"
            echo "generate_release_notes=false" >> "$GITHUB_OUTPUT"
          else
            echo "No committed notes found at $NOTES_FILE, falling back to auto-generated changelog"
            echo "body_path=" >> "$GITHUB_OUTPUT"
            echo "generate_release_notes=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Create or Update GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.VERSION }}
          name: "Context Crystal ${{ steps.version.outputs.VERSION }}"
          draft: false
          prerelease: false
          body_path: ${{ steps.notes.outputs.body_path }}
          generate_release_notes: ${{ steps.notes.outputs.generate_release_notes }}
          files: |
            artifacts/*.tar.gz
            artifacts/SHA256SUMS

  publish-maven-central:
    name: Publish to Maven Central
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code with full history for dynver
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "21"

      - name: Setup sbt
        uses: sbt/setup-sbt@v1

      - name: Cache Coursier
        uses: coursier/cache-action@v6

      - name: Publish JVM Artifacts via sbt-ci-release
        run: sbt ci-release
        env:
          PGP_PASSPHRASE: ${{ secrets.PGP_PASSPHRASE }}
          PGP_SECRET: ${{ secrets.PGP_SECRET }}
          SONATYPE_PASSWORD: ${{ secrets.SONATYPE_PASSWORD }}
          SONATYPE_USERNAME: ${{ secrets.SONATYPE_USERNAME }}

  verify-release-smoke:
    name: Smoke Verify Release (${{ matrix.os }})
    needs: publish-release
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - macos-14
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Determine Release Version
        id: version
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            VERSION="${{ inputs.tag }}"
          else
            VERSION="${GITHUB_REF#refs/tags/}"
          fi
          echo "VERSION=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Clean-Room Smoke Test (POSIX Installer & DAG Lifecycle)
        run: |
          VERSION="${{ steps.version.outputs.VERSION }}"
          SMOKE_DIR="$(mktemp -d)"
          sh ./install.sh --to "$SMOKE_DIR/bin" --version "$VERSION"
          "$SMOKE_DIR/bin/ccrystal" --store "$SMOKE_DIR/store" batch "init smoke-ci -g 'Verify release binary' -t 'Run batch lifecycle'; task done smoke-ci -t task-1; conclude smoke-ci -s 'Verified in CI smoke test'"
          rm -rf "$SMOKE_DIR"


